<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Every interface carries assumptions</title>
  <desc id="desc">A robot workflow proceeds through Observe, Ground, Validate, Execute, and Verify. Grounding must account for coordinate frames, units, timestamps, and uncertainty; an image pixel is not a robot coordinate. Independent workspace, force, and speed constraints inform validation and must also be enforced during motion. Verification compares the expected result with observed state.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#a9b9a4"/></marker><marker id="constraint" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#e7a17d"/></marker></defs>
  <rect width="1200" height="650" rx="20" fill="#182c29"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="56" y="51" fill="#a9b9a4" font-size="14" letter-spacing="3">EMBODIED AI / INTERFACE CONTRACTS</text>
    <text x="56" y="107" fill="#f7f5f0" font-size="44" font-weight="700">Every interface carries assumptions</text>
    <text x="56" y="145" fill="#a9b9a4" font-size="21">Reliable behavior depends on what survives each handoff.</text>
    <g fill="#a9b9a4" font-size="13" letter-spacing="1.6">
      <text x="56" y="201">01</text><text x="279" y="201">02</text><text x="502" y="201">03</text><text x="725" y="201">04</text><text x="948" y="201">05</text>
    </g>
    <g fill="#213a34" stroke="#587266" stroke-width="1.5">
      <rect x="56" y="222" width="198" height="144" rx="12"/>
      <rect x="279" y="222" width="198" height="144" rx="12" fill="#30463c" stroke="#a9b9a4"/>
      <rect x="502" y="222" width="198" height="144" rx="12"/>
      <rect x="725" y="222" width="198" height="144" rx="12"/>
      <rect x="948" y="222" width="198" height="144" rx="12"/>
    </g>
    <g fill="#f7f5f0" font-size="26" font-weight="700">
      <text x="77" y="267">Observe</text><text x="300" y="267">Ground</text><text x="523" y="267">Validate</text><text x="746" y="267">Execute</text><text x="969" y="267">Verify</text>
    </g>
    <g fill="#c8d2c3" font-size="18">
      <text x="77" y="305">Images + sensors</text><text x="77" y="333">Capture state</text>
      <text x="300" y="305" font-size="16">Pixel → frame → pose</text><text x="300" y="333">Resolve meaning</text>
      <text x="523" y="305">State + limits</text><text x="523" y="333">Reject ambiguity</text>
      <text x="746" y="305">Bounded skills</text><text x="746" y="333">Monitor motion</text>
      <text x="969" y="305">Expected vs. actual</text><text x="969" y="333">Measure outcome</text>
    </g>
    <g fill="none" stroke="#a9b9a4" stroke-width="2" marker-end="url(#arrow)">
      <path d="M256 294H274"/><path d="M479 294H497"/><path d="M702 294H720"/><path d="M925 294H943"/>
      <path d="M378 447V373" stroke-dasharray="7 6"/>
    </g>
    <rect x="56" y="447" width="652" height="122" rx="12" fill="#213a34" stroke="#587266" stroke-width="1.5"/>
    <text x="78" y="484" fill="#a9b9a4" font-size="18">Frames · units · timestamps · uncertainty</text>
    <text x="78" y="529" fill="#f7f5f0" font-size="26" font-weight="700">Pixels do not equal robot coordinates.</text>
    <rect x="740" y="447" width="406" height="122" rx="12" fill="#3d3e32" stroke="#e7a17d" stroke-width="1.5"/>
    <text x="762" y="484" fill="#f7f5f0" font-size="23" font-weight="700">Independent constraints</text>
    <text x="762" y="516" fill="#e7a17d" font-size="18">Workspace · force · speed</text>
    <text x="762" y="544" fill="#e7a17d" font-size="17">Checked before and during motion</text>
    <path d="M943 447V407H601V373" fill="none" stroke="#e7a17d" stroke-width="2.5" marker-end="url(#constraint)"/>
    <path d="M824 407V373" fill="none" stroke="#e7a17d" stroke-width="2.5" marker-end="url(#constraint)"/>
    <text x="56" y="618" fill="#a9b9a4" font-size="18">Make each assumption explicit before the next component relies on it.</text>
  </g>
</svg>
